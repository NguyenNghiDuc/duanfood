name: CI

on:
  push:
    branches: [main, feat/production-hardening]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      SESSION_SECRET: ci-test-secret-that-is-long-enough
      SESSION_STORE: memory
      USE_MYSQL: 0
      TEST_OTP: 123456
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript, EJS and full commerce flow
        run: npm test
      - name: Build Docker image
        run: docker build -t mini-food:ci .
